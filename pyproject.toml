[project]
name = "fastpunkt"
version = "0.1.0"
description = "Evidence-first research agent for Norwegian companies (Builderr Signalpost)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ritesh Kumar Mahato", email = "riteshmahatowork@gmail.com" }]
dependencies = ["beautifulsoup4==4.13.4"]

[project.scripts]
fastpunkt = "fastpunkt.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
